name: Senflare Proxy Test

# 定时跑优选测试：拉取多源 → TCP/HTTP 检测 → 地区补全 → 提交结果文件
on:
  schedule:
    - cron: '23 */12 * * *'    # 每12小时一次（UTC，避开整点高峰）
  workflow_dispatch:           # 支持手动触发

permissions:
  contents: write              # 允许提交结果文件回仓库

concurrency:                    # 上一次还没跑完时不叠加新任务
  group: senflare-proxy-test
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔎 运行优选测试
        run: python Start.py
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WECHAT_API_URL: ${{ secrets.WECHAT_API_URL }}
          WECHAT_AUTH_TOKEN: ${{ secrets.WECHAT_AUTH_TOKEN }}

      - name: 💾 提交结果/地区缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Senflare-Proxy.txt || true
          git add Senflare-Proxy-Bidirectional.txt Senflare-Proxy-Forward.txt Senflare-Proxy-Reverse.txt Senflare-Proxy-Invalid.txt Senflare-Proxy-All.txt || true
          git add Senflare-Country.json || true
          if git diff --cached --quiet; then
            echo "✅ 结果无变化，跳过提交"
          else
            git commit -m "🔄 数据更新 $(TZ=Asia/Shanghai date +%Y-%m-%d-%H:%M) [ Senflare ]"
            git pull --rebase origin main2 || git pull --rebase origin main || true
            git push
          fi
